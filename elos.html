<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="O mundo de Elos de Areia, de Pietro Abbate: um mapa que se revela conforme voce le o livro.">
<title>O Mundo de Elos de Areia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#1B1710; --sea:#2B4A55; --parch:#EFE3C8; --parch-2:#D8C6A0;
    --gold:#C9A24A; --gold-hi:#F0DCA2; --verm:#A8412E; --moss:#6E7F4A;
    --panel:rgba(24,19,13,.86); --line:rgba(201,162,74,.34);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#12100C;color:var(--parch);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #world{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;background:#12100C;}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #c.hot{cursor:pointer;} #c.drag{cursor:grabbing;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .hud{position:absolute;z-index:3;}
  .panel{background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-radius:5px;box-shadow:0 12px 34px rgba(0,0,0,.5);}
  .tl{left:18px;top:18px;padding:13px 17px 14px;max-width:min(330px,46vw);}
  .tl h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.72rem;line-height:1.05;margin:0;letter-spacing:.01em;color:var(--parch);}
  .tl .by{font-size:.68rem;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:6px;}
  .tl .rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:11px 0 9px;}
  .tl p{margin:0;font-size:.79rem;color:#B3A489;line-height:1.5;}
  .tr{right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(340px,52vw);}
  .seg{display:flex;flex-wrap:wrap;justify-content:flex-end;padding:3px;gap:2px;}
  .seg button{appearance:none;border:0;background:transparent;color:#9B8E76;font:700 .66rem/1 Karla,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:3px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:rgba(201,162,74,.17);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(201,162,74,.5);}
  .seg button:hover{color:var(--parch);}
  .seg button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}
  .hint{font-size:.68rem;letter-spacing:.05em;color:#7E7360;padding:7px 11px;text-align:right;}
  .zoom{display:inline-flex;padding:3px;gap:2px;}
  .zoom button{appearance:none;border:0;background:transparent;color:var(--parch);font:400 1rem/1 "Cormorant Garamond",Georgia,serif;width:30px;height:28px;border-radius:3px;cursor:pointer;}
  .zoom button:hover{background:rgba(201,162,74,.16);color:var(--gold-hi);}
  .card{left:18px;bottom:18px;width:min(374px,calc(100% - 36px));padding:15px 18px 16px;}
  .card .k{font-size:.66rem;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .card .k.locked{color:var(--verm);}
  .card h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.5rem;line-height:1.1;margin:4px 0 0;}
  .card .tag{font-size:.68rem;letter-spacing:.08em;color:#8E8270;}
  .card p{margin:9px 0 0;font-size:.83rem;color:#B3A489;}
  .card p em{color:var(--gold-hi);font-style:italic;}
  .card .q{margin:10px 0 0;padding-left:11px;border-left:2px solid rgba(201,162,74,.42);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:.94rem;color:#CDBE9E;}
  .card .meta{margin-top:11px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#7E7360;}
  @media (max-width:820px){ .tl{max-width:58vw;padding:10px 12px;} .tl h1{font-size:1.3rem;} .tl p{display:none;} .hint{display:none;} .card{width:calc(100% - 36px);} }
</style>

</head>
<body>
<div id="world">
  <canvas id="c" aria-label="Mapa do mundo de Elos de Areia: reinos, mares e as terras ainda cobertas de névoa."></canvas>
  <div class="sr" id="sr" aria-label="Lugares do mundo"></div>

  <aside class="hud panel tl">
    <h1>O Mundo de<br>Elos de Areia</h1>
    <div class="by">Pietro Abbate</div>
    <div class="rule"></div>
    <p>O mapa abre conforme você lê. Cada lugar se descobre no capítulo em que a história chega nele — o norte continua na névoa porque o primeiro livro ainda não foi até lá.</p>
  </aside>

  <div class="hud tr">
    <div class="seg panel" role="group" aria-label="Progresso de leitura" id="prog"></div>
    <div class="zoom panel" role="group" aria-label="Zoom">
      <button type="button" id="zin" aria-label="Aproximar">+</button>
      <button type="button" id="zout" aria-label="Afastar">−</button>
      <button type="button" id="zall" aria-label="Ver o mundo inteiro" style="width:auto;padding:0 10px;font:700 .66rem Karla,sans-serif;letter-spacing:.1em;">TUDO</button>
    </div>
    <div class="hint panel">arraste para mover · role para aproximar · passe o mouse nos lugares</div>
  </div>

  <div class="hud panel card" id="card"></div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const cardEl=document.getElementById('card'), srEl=document.getElementById('sr');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){ s=s|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }

/* ===================== progresso de leitura ===================== */
const STAGES=[
 {id:'inicio', label:'Capítulo 1',   n:1, who:'O mundo como ele começa'},
 {id:'meio',   label:'Metade',       n:2, who:'A viagem para o norte'},
 {id:'fim',    label:'Fim do livro', n:3, who:'Elos de Areia, completo'},
 {id:'fogo',   label:'Elos de Fogo', n:4, who:'O que o segundo livro abre'}
];
let stage=0;

/* ===================== os lugares ===================== */
/* x,y são frações do mapa (0..1). `at` = em que etapa o lugar se abre.        */
/* Os textos saem do próprio livro e do glossário — nada foi inventado aqui.   */
const PLACES=[
 {id:'alibard', name:'Alibard', x:.567, y:.910, at:1, kind:'Reino do sul',
  p:'A floresta e a serra onde a história começa. Alibard tem tradição de mesa e de casa: <em>“pela velha tradição de Alibard, um anfitrião jamais deixa uma dama chegar à mesa desacompanhada.”</em>',
  q:'Nagarc é uma cidade em formação, um paraíso dentro da Serra de Alibard.'},
 {id:'nagarc', name:'Nagarc', x:.585, y:.840, at:1, kind:'Cidade em formação',
  p:'Encravada no vale do rio Tálmmos, ainda em botão. É o destino que se deseja e que quase não se alcança — o vale é fechado por uma muralha de vento.',
  q:'Ali Nagarc há de erguer-se: majestosa, ainda em botão, no vale do rio Tálmmos.'},
 {id:'talmmos', name:'Vale do Tálmmos', x:.545, y:.795, at:2, kind:'Vale selado',
  p:'O Círculo do Vento fecha o vale do Tálmmos. A triagem no Portão da Torre Dourada é a única passagem — não há outra maneira de atravessar.',
  q:'Um cinturão de ar, selando o vale do rio Tálmmos… É difícil de imaginar.'},
 {id:'usabar', name:'Usabar', x:.323, y:.933, at:1, kind:'Terra do fruto',
  p:'Uma das quatro terras onde restaram árvores <em>aghar</em>. O fruto fresco, colhido e comido logo em seguida, devolve a saúde inteira — é o único remédio conhecido para a peste dolrakiana.',
  q:'A resposta para isso encontraremos em Usabar.'},
 {id:'condoras', name:'Condoras', x:.285, y:.771, at:1, kind:'Costa inquieta',
  p:'Os condorianos vivem em praias diante de um mar que não sossega. Dali vêm carroceiros e viajantes — a estrada para o sul passa por aqui.',
  q:'Meu nome é Félgar, de Condoras.'},
 {id:'telurya', name:'Telurya', x:.462, y:.517, at:2, kind:'Ilha dos alquimistas',
  p:'A ilha de florestas misteriosas, onde vivem os Alquimistas Supremos. A fé teluryana não é unificada: para alguns, é o sol que dissipa as almas dos mortos; para outros, é ele que as leva a outro mundo. Quatro árvores <em>aghar</em> floresceram aqui.',
  q:'Assim devem sentir-se os teluryanos em sua ilha de florestas misteriosas.'},
 {id:'arzul', name:'Arzul', x:.408, y:.700, at:2, kind:'Forja do ascar',
  p:'De Arzul vem o <em>ascar</em>, o ferro arzuliano das lâminas finas — a adaga de Eudda é de ascar, com runas de ouro cravadas num cabo de marfim. Arzulianos sabem virar o tempo contra quem os persegue.',
  q:'Mesmo para um par de arzulianos, enfrentar um enxame daquele tamanho seria bem mais difícil.',
  note:'posição a confirmar — Arzul não está rotulada no mapa'},
 {id:'efelion', name:'Efélion', x:.885, y:.410, at:2, kind:'O mal a leste',
  p:'A ninhada de Efélion: as harpias-negras, corvos e gralhas em tamanho grande, as mais agressivas de toda a cria. Viver perto de Efélion é um consolo pequeno.',
  q:'Efélion também se espalhará até o coração de Lynuor e de Tamdaroc.'},
 {id:'yalif', name:'Oásis de Yalif', x:.904, y:.857, at:3, kind:'Reino do oásis',
  p:'A árvore <em>aghar</em> de folhas prateadas e fruto redondo que pulsa; a raiz <em>balar</em> destilada em alambiques de cobre; a especiaria <em>qadir</em>; o cacto <em>iskelamet</em>. O oásis é guardado pelas damas de ossos, convocadas pela corrente das matriarcas.',
  q:'Quando você chegar a Yalif, aprenderá coisas que mal pode imaginar.'},
 {id:'abaul', name:'Sultanato de Abaúl', x:.771, y:.842, at:3, kind:'Deserto de dunas',
  p:'Do alto das dunas mais altas de Abaúl ainda se veem, hoje, lampejos de ouro e prata. A descoberta foi feita a cento e vinte milhas ao norte do sultanato, deserto adentro.',
  q:'Ainda hoje, do alto das mais altas dunas de Abaúl, os viajantes veem lampejos de ouro e prata.'},
 {id:'tabrak', name:'Tabrak', x:.832, y:.916, at:3, kind:'Deserto do leste',
  p:'Tênomo é a cidade mais orgulhosa e mais rica de Tabrak, e seus habitantes raramente são vistos fora das próprias fronteiras.',
  q:'É apenas outro nome para Tabrak.'},
 {id:'furiah', name:'Fúriah', x:.585, y:.710, at:3, kind:'Planície da batalha',
  p:'O nome de Fúriah aparece uma única vez no primeiro livro, e aparece como façanha: foi ali que se queimaram os acampamentos de Ábbator.',
  q:'O herói que queimou os acampamentos de Ábbator em Fúriah.'},
 {id:'ilhafarol', name:'Ilha do Farol', x:.925, y:.738, at:3, kind:'Ilha do mar oriental',
  p:'Uma ilha solitária no mar a leste, entre Fúriah e os desertos. Está desenhada no mapa e ainda não foi visitada pela história.',
  note:'sem menção no primeiro livro'},
 {id:'golfo', name:'Golfo Boreal', x:.660, y:.380, at:3, kind:'Mar do norte',
  p:'O grande golfo que separa o sul habitado das terras boreais. Atravessá-lo é o que o primeiro livro ainda não fez.'},
 {id:'lynuor', name:'Lynuor', x:.350, y:.115, at:4, kind:'Terra dos órindons',
  p:'Asulbar tombou em Elderost, onde hoje se ergue Lynuor, e sua essência divina deu origem aos <em>órindons</em> — o povo alado do velho império, armado de sabres, inimigo antigo dos <em>ilúvis</em>. Duas árvores <em>aghar</em> floresceram aqui.',
  q:'Asulbar tombou em Elderost, onde hoje se ergue Lynuor.'},
 {id:'tamdaroc', name:'Tamdaroc', x:.800, y:.130, at:4, kind:'Norte distante',
  p:'Citada uma única vez no primeiro livro, e como ameaça futura: o mal de Efélion há de alcançá-la.',
  q:'Efélion também se espalhará até o coração de Lynuor e de Tamdaroc.'},
 {id:'volubro', name:'Vólubro', x:.687, y:.564, at:4, kind:'Serra do veneno',
  p:'De Vólubro vem a seiva que, misturada a sangue de diabrete, mata até <em>ilúvis</em>. É também um dos lugares apontados como cenário de um episódio que ninguém conta igual.',
  q:'Seiva de Vólubro misturada a sangue de diabrete, letal até para ilúvis.'},
 {id:'alkar', name:'Alkar', x:.098, y:.617, at:4, kind:'Reino de gelo',
  p:'Os alkarianos entre suas morsas, seus trenós e suas montanhas de gelo. O grande Lago Alkar e a cordilheira congelada ficam para trás de quem viaja ao sul.',
  q:'Os alkarianos entre suas morsas, trenós e montanhas de gelo.'},
 {id:'aori', name:'Aöri', x:.290, y:.654, at:4, kind:'Ilha do golfo',
  p:'Uma ilha pequena no golfo, e uma das quatro terras onde uma árvore <em>aghar</em> chegou a florescer.',
  q:'Quatro aghares floresceram em Telurya, dois em Lynuor, um em Usabar e outro em Aöri.'},
 {id:'baia', name:'Baía Boreal', x:.430, y:.028, at:4, kind:'Extremo norte',
  p:'O limite norte do mapa desenhado. Nada no primeiro livro chega até aqui.'}
];
const AT_LABEL={1:'Capítulo 1',2:'Metade do livro',3:'Fim de Elos de Areia',4:'Elos de Fogo'};

/* ===================== desenho ===================== */
function halo(x,y,r,rgb,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(.45,`rgba(${rgb},${a*.35})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function fog(now){
  const locked=PLACES.filter(p=>!open(p)); if(!locked.length) return;
  const t=reduce?0:now;
  ctx.save();
  for(const p of locked){ const [x,y]=px(p), R=Math.max(64,IMG.width*S*0.088);
    for(let i=0;i<3;i++){
      const w=Math.sin(t*0.22+i*2.1+p.x*7)*R*0.07, h=Math.cos(t*0.19+i*1.7)*R*0.05;
      const g=ctx.createRadialGradient(x+w,y+h,0,x+w,y+h,R*(0.78+i*0.22));
      g.addColorStop(0,'rgba(26,25,31,.62)'); g.addColorStop(.5,'rgba(32,31,39,.40)'); g.addColorStop(1,'rgba(36,35,45,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+w,y+h,R*(0.92+i*0.22),R*(0.70+i*0.18),0,0,Math.PI*2); ctx.fill(); }
  }
  ctx.restore();
}
function key(x,y,s,glow){
  const g=ctx.createLinearGradient(x-s,y-s,x+s,y+s);
  g.addColorStop(0,'#7A5A1E'); g.addColorStop(.42,'#F1D27A'); g.addColorStop(.72,'#FFF3C8'); g.addColorStop(1,'#9A7526');
  if(glow) halo(x,y,s*4.2,'240,206,110',.34);
  ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.5,s*.30); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y-s*.52,s*.44,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-s*.10); ctx.lineTo(x,y+s*1.0); ctx.stroke();
  ctx.lineWidth=Math.max(1.2,s*.24);
  ctx.beginPath(); ctx.moveTo(x,y+s*.56); ctx.lineTo(x+s*.46,y+s*.56); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+s*.96); ctx.lineTo(x+s*.32,y+s*.96); ctx.stroke();
  ctx.lineCap='butt';
}
function marker(p,now){
  const [x,y]=px(p), isHot=(hot===p.id||sel===p.id), o=open(p);
  const s=clamp(9*Math.pow(Z,.34),8,17)*(isHot?1.22:1);
  if(o){
    const pulse=reduce?.5:(.5+.5*Math.sin(now*1.5+p.x*9));
    halo(x,y,s*3.6,'240,220,150',(isHot?.5:.26)+.08*pulse);
    ctx.fillStyle='rgba(20,16,10,.78)'; ctx.beginPath(); ctx.arc(x,y,s*.9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=isHot?'#F0DCA2':'#C9A24A'; ctx.lineWidth=Math.max(1.3,s*.17);
    ctx.beginPath(); ctx.arc(x,y,s*.9,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=isHot?'#FFF3C8':'#E4CB86';
    ctx.beginPath(); for(let i=0;i<4;i++){ const a=i/4*Math.PI*2-Math.PI/2, r=(i%2?s*.24:s*.5);
      const qx=x+Math.cos(a)*s*.46, qy=y+Math.sin(a)*s*.46; i?ctx.lineTo(qx,qy):ctx.moveTo(qx,qy);
      const a2=a+Math.PI/4; ctx.lineTo(x+Math.cos(a2)*s*.2,y+Math.sin(a2)*s*.2); }
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle='rgba(14,12,16,.62)'; ctx.beginPath(); ctx.arc(x,y,s*1.05,0,Math.PI*2); ctx.fill();
    key(x,y,s*.82,isHot);
  }
  if(isHot||o){ // rótulo
    const nm=p.name, f=Math.max(12,Math.min(21,13*Math.pow(Z,.3)));
    ctx.font=`600 ${f}px "Cormorant Garamond", Georgia, serif`;
    const w=ctx.measureText(nm).width, bx=x-w/2-9, by=y+s*1.5;
    if(isHot){ ctx.fillStyle='rgba(20,16,11,.88)'; ctx.strokeStyle='rgba(201,162,74,.55)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(bx,by,w+18,f+11,3); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle=isHot?'#F5EAD0':(o?'rgba(240,228,200,.86)':'rgba(200,186,160,.5)');
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(!isHot){ ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=6; }
    ctx.fillText(nm,x,by+(f+11)/2); ctx.shadowBlur=0; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
}
const GRAIN=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const k=c.getContext('2d');
  const d=k.createImageData(128,128), r=rng(88);
  for(let i=0;i<d.data.length;i+=4){ const v=(110+r()*90)|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  k.putImageData(d,0,0); return c; })();
let GP=null;
function frame(now){
  T=now; tickCam();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  { const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);
    bg.addColorStop(0,'#1E1913'); bg.addColorStop(1,'#0C0A08'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H); }
  if(ready){ ctx.save(); ctx.shadowColor='rgba(0,0,0,.75)'; ctx.shadowBlur=38; ctx.fillStyle='#000';
    ctx.fillRect(ox+6,oy+6,IMG.width*S-12,IMG.height*S-12); ctx.restore(); }
  if(ready){ ctx.imageSmoothingEnabled=true; ctx.drawImage(IMG,ox,oy,IMG.width*S,IMG.height*S); }
  fog(now);
  for(const p of PLACES) marker(p,now);
  // gradação e grão de pergaminho
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.18;
  const cg=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.5,Math.max(W,H)*.8);
  cg.addColorStop(0,'rgb(255,226,170)'); cg.addColorStop(1,'rgb(40,50,90)');
  ctx.fillStyle=cg; ctx.fillRect(0,0,W,H); ctx.restore();
  if(!GP){ try{ GP=ctx.createPattern(GRAIN,'repeat'); }catch(e){} }
  if(GP){ ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.055;
    const dx=reduce?0:((now*640)%128), dy=reduce?0:((now*430)%128);
    ctx.translate(-dx,-dy); ctx.fillStyle=GP; ctx.fillRect(0,0,W+128,H+128); ctx.restore(); }
  const vg=ctx.createRadialGradient(W/2,H*.46,Math.min(W,H)*.36,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
function loop(ts){ const now=ts/1000; if(cv.clientWidth!==W||cv.clientHeight!==H) fit(); frame(now); requestAnimationFrame(loop); }

/* ===================== interação ===================== */
function hitAt(mx,my){ let best=null,bd=1e9;
  for(const p of PLACES){ const [x,y]=px(p); const d=Math.hypot(mx-x,my-y);
    const r=clamp(9*Math.pow(Z,.34),8,17)*2.4;
    if(d<r&&d<bd){ bd=d; best=p.id; } }
  return best; }
let drag=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,ox,oy,moved:false,id:e.pointerId}; cam=null; });
cv.addEventListener('pointermove',e=>{ const rc=cv.getBoundingClientRect(), mx=e.clientX-rc.left, my=e.clientY-rc.top;
  if(drag&&drag.id===e.pointerId){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4){ drag.moved=true; cv.classList.add('drag'); }
    if(drag.moved){ ox=drag.ox+dx; oy=drag.oy+dy; center(); } return; }
  const id=hitAt(mx,my); if(id!==hot){ hot=id; cv.classList.toggle('hot',!!id); renderCard(); } });
cv.addEventListener('pointerup',e=>{ if(!drag) return; const moved=drag.moved; drag=null; cv.classList.remove('drag');
  if(!moved){ const rc=cv.getBoundingClientRect(); const id=hitAt(e.clientX-rc.left,e.clientY-rc.top);
    sel=(id&&sel!==id)?id:null; if(id){ const p=PLACES.find(q=>q.id===id); focusOn(p,Math.max(Z,2.1)); } renderCard(); } });
cv.addEventListener('pointercancel',()=>{ drag=null; cv.classList.remove('drag'); });
cv.addEventListener('mouseleave',()=>{ if(!drag){ hot=null; cv.classList.remove('hot'); renderCard(); } });
cv.addEventListener('wheel',e=>{ e.preventDefault(); const rc=cv.getBoundingClientRect();
  zoomAt(e.clientX-rc.left,e.clientY-rc.top,Math.exp(-e.deltaY*0.0013)); },{passive:false});
const tp=new Map(); let pinch=null;
cv.addEventListener('touchstart',e=>{ for(const t of e.changedTouches) tp.set(t.identifier,[t.clientX,t.clientY]);
  if(tp.size===2){ const [a,b]=[...tp.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:Z}; drag=null; } },{passive:true});
cv.addEventListener('touchmove',e=>{ for(const t of e.changedTouches) tp.set(t.identifier,[t.clientX,t.clientY]);
  if(pinch&&tp.size===2){ const [a,b]=[...tp.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    const rc=cv.getBoundingClientRect(); zoomAt((a[0]+b[0])/2-rc.left,(a[1]+b[1])/2-rc.top,(pinch.z*d/pinch.d)/Z); } },{passive:true});
cv.addEventListener('touchend',e=>{ for(const t of e.changedTouches) tp.delete(t.identifier); if(tp.size<2) pinch=null; },{passive:true});
document.getElementById('zin').addEventListener('click',()=>zoomAt(W/2,H/2,1.4));
document.getElementById('zout').addEventListener('click',()=>zoomAt(W/2,H/2,1/1.4));
document.getElementById('zall').addEventListener('click',()=>{ Z=1; S=Sfit; center(); cam=null; sel=null; renderCard(); });

/* ===================== HUD ===================== */
function renderCard(){
  const id=hot||sel, p=id?PLACES.find(q=>q.id===id):null;
  if(!p){ const st=STAGES[stage], n=PLACES.filter(open).length;
    cardEl.innerHTML=`<div class="k">${st.label}</div><h2>${st.who}</h2>
      <p>${n} de ${PLACES.length} lugares revelados. Passe o mouse pelo mapa — os que estão sob névoa abrem quando a leitura chega neles.</p>
      <div class="meta">Mapa de Elos de Areia · Pietro Abbate</div>`; return; }
  const o=open(p);
  cardEl.innerHTML=`<div class="k ${o?'':'locked'}">${o?p.kind:'Ainda na névoa'}</div>
    <h2>${p.name}</h2>
    ${o?`<p>${p.p}</p>${p.q?`<div class="q">“${p.q}”</div>`:''}`
       :`<p>Este lugar se revela em <b style="color:#F0DCA2">${AT_LABEL[p.at]}</b>. A névoa não é enfeite: é o que a história ainda não mostrou.</p>`}
    <div class="meta">${o?('Abre em '+AT_LABEL[p.at]):'🔑 trancado'}${p.note?' · '+p.note:''}</div>`;
}
function buildProg(){ const el=document.getElementById('prog'); el.innerHTML='';
  STAGES.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=s.label;
    b.setAttribute('aria-pressed', i===stage?'true':'false');
    b.addEventListener('click',()=>{ stage=i; for(const o of el.children) o.setAttribute('aria-pressed','false');
      b.setAttribute('aria-pressed','true'); sel=null; renderCard(); });
    el.appendChild(b); }); }
function buildSr(){ srEl.innerHTML=''; for(const p of PLACES){ const b=document.createElement('button'); b.type='button';
  b.textContent=`${p.name} — ${p.kind||''}`;
  b.addEventListener('focus',()=>{ hot=p.id; focusOn(p,2.1); renderCard(); });
  b.addEventListener('blur',()=>{ hot=null; renderCard(); });
  b.addEventListener('click',()=>{ sel=sel===p.id?null:p.id; renderCard(); });
  srEl.appendChild(b); } }
window.addEventListener('resize',fit);
if('ResizeObserver' in window){ try{ new ResizeObserver(()=>fit()).observe(document.getElementById('world')); }catch(e){} }
if(document.fonts&&document.fonts.load){ document.fonts.load('600 20px "Cormorant Garamond"'); document.fonts.load('700 11px Karla'); }
buildProg(); buildSr(); fit(); renderCard(); requestAnimationFrame(loop);
})();
</script>
