<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mundo de leitura de Luiz: 13 generos, 7 salas cada. Cada sala abre com 1 livro do subgenero.">
<title>Praça de Luiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;500;600&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --void:#08070D; --panel:rgba(14,11,20,.78); --line:rgba(201,162,39,.32);
    --parch:#EFE6D2; --dust:#A2937F; --dust-2:#6E6357;
    --gold:#D4AC35; --gold-hi:#F1D27A; --moss:#8CA063; --verm:#C24B35;
    --fs-xs:.7rem;--fs-sm:.84rem;--fs-lg:1.35rem;--fs-xl:1.9rem;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--parch);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #game{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;background:var(--void);}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;touch-action:pan-y;}
  #c.hot{cursor:pointer;} #c.drag{cursor:grabbing;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .hud{position:absolute;z-index:3;}
  .panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .hud-tl{left:18px;top:18px;padding:12px 16px 13px;min-width:236px;}
  .crest{display:flex;align-items:center;gap:11px;}
  .crest svg{width:30px;height:34px;flex:none;}
  .crest h1{font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:var(--fs-xl);line-height:1;margin:0;letter-spacing:.01em;}
  .crest .who{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px;}
  .stats{display:flex;gap:16px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);}
  .stat b{display:block;font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:1.35rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .stat span{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dust);}
  .hud-tr{right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .seg{display:inline-flex;padding:3px;gap:2px;}
  .seg button,.seg a{appearance:none;border:0;background:transparent;color:var(--dust);font:700 .72rem/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:4px;cursor:pointer;text-decoration:none;}
  .seg button[aria-pressed="true"]{background:rgba(212,172,53,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(212,172,53,.45);}
  .seg a:hover,.seg button:hover{color:var(--parch);}
  .seg button:focus-visible,.seg a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}
  .hint{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--dust-2);padding:6px 10px;}
  .hud-b{left:18px;bottom:20px;width:min(340px,calc(100% - 36px));padding:12px 16px 13px;}
  .hud-b:empty{display:none;}
  @media (max-width:640px){ .hud-b{left:50%;transform:translateX(-50%);width:calc(100% - 36px);} }
  .card{display:grid;grid-template-columns:1fr auto;gap:2px 18px;align-items:baseline;}
  .card .k{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .card .k.sealed{color:var(--verm);} .card .k.near{color:var(--moss);}
  .card h2{font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:var(--fs-lg);line-height:1;margin:2px 0 0;}
  .card .n{grid-column:2;grid-row:1/3;font-family:"Grenze Gotisch",Georgia,serif;font-size:1.6rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .card .n small{font-family:Karla,sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dust);margin-left:6px;}
  .card p{grid-column:1/-1;margin:6px 0 0;font-size:var(--fs-sm);color:var(--dust);}
  .card p a{color:var(--gold-hi);text-decoration:none;border-bottom:1px solid rgba(241,210,122,.35);}
  .bar{grid-column:1/-1;height:5px;margin-top:9px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .bar.near i{background:linear-gradient(90deg,#6E8250,var(--moss));}
  .bar.sealed i{background:linear-gradient(90deg,#7E2A20,var(--verm));}
  @media (max-width:980px){ .hint{display:none;} }
  @media (max-width:640px){ .hud-tl{min-width:0;padding:10px 12px;} .stats{gap:12px;} .crest h1{font-size:1.45rem;} .seg button,.seg a{padding:6px 7px;font-size:.62rem;} }
</style>

</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Praça ao entardecer com castelo, catedral, mesquita, templo budista, templo grego, fórum romano, torre de astronomia, cemitério e uma feira; leitores caminham com pilhas de livros."></canvas>
  <div class="sr" id="sr" aria-label="Prédios da praça"></div>

  <aside class="hud panel hud-tl">
    <div class="crest">
      <svg viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 L28 6 V17 C28 25 22 30 15 33 C8 30 2 25 2 17 V6 Z" fill="#1B1522" stroke="#D4AC35" stroke-width="1.4"/><path d="M9 11 h12 v3 h-12 z M10 15 h10 v9 h-10 z" fill="#D4AC35"/><path d="M13 17 h4 v7 h-4 z" fill="#1B1522"/></svg>
      <div>
        <h1>Praça de Luiz</h1>
        <div class="who" id="who">Mês 3 · 84 livros</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sOpen">6</b><span>abertos</span></div>
      <div class="stat"><b id="sNear">2</b><span>quase lá</span></div>
      <div class="stat"><b id="sSeal">1</b><span>selados</span></div>
    </div>
  </aside>

  <div class="hud hud-tr">
    <div class="seg panel" role="group" aria-label="Qualidade gráfica" id="gfx">
      <button type="button" data-gfx="2" aria-pressed="true">Ultra</button>
      <button type="button" data-gfx="1" aria-pressed="false">Simples</button>
    </div>
    <div class="seg panel"><a href="https://claude.ai/code/artifact/7d9aa841-9e1e-47cd-8c3f-025413ac85e5" target="_blank" rel="noopener">Ver o mapa do reino ↗</a></div>
    <div class="hint panel">mouse nos prédios · Shift = placas · 14 portas para o reino</div>
  </div>

  <div class="hud panel hud-b" id="card"></div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const cardEl=document.getElementById('card'), srEl=document.getElementById('sr');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){ let s=seed|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function col(c,f,a){ const r=Math.min(255,c[0]*f)|0,g=Math.min(255,c[1]*f)|0,b=Math.min(255,c[2]*f)|0; return a==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a})`; }
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

/* ===================== câmera: cena virtual 1600×900, "cover" com arrasto lateral ===================== */
const VW=1600, VH=900;
let W=0,H=0,DPR=1,S=1,OX=0,OY=0,pan=0,panMax=0,GFX=2,T=0;
function fit(){ DPR=Math.min(1.75,window.devicePixelRatio||1); W=Math.max(1,cv.clientWidth); H=Math.max(1,cv.clientHeight); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  S=Math.max(W/VW,H/VH); panMax=Math.max(0,(VW*S-W)/2); pan=clamp(pan,-panMax,panMax); OX=(W-VW*S)/2+pan; OY=(H-VH*S)/2; renderStatic(); }
function toV(mx,my){ return [(mx-OX)/S,(my-OY)/S]; }

/* ===================== camadas estáticas (desenhadas uma vez, em resolução de dispositivo) ===================== */
const LFAR=document.createElement('canvas'), LMID=document.createElement('canvas'), LFRONT=document.createElement('canvas'), LTMP=document.createElement('canvas');
let g=null; // contexto corrente para as funções de desenho
function layerCtx(cn){ const q=S*DPR; const w=Math.ceil(VW*q), h=Math.ceil(VH*q); if(cn.width!==w||cn.height!==h){ cn.width=w; cn.height=h; } const c=cn.getContext('2d'); c.setTransform(q,0,0,q,0,0); c.clearRect(0,0,VW,VH); c.lineJoin='round'; return c; }
function renderStatic(){ if(W<2) return;
  g=layerCtx(LTMP); drawSky(); drawFar();
  const far=layerCtx(LFAR); far.setTransform(1,0,0,1,0,0); const m=Math.ceil(4*S*DPR); if('filter' in far&&GFX>=2){ far.filter=`blur(${Math.max(1,2.2*S*DPR).toFixed(1)}px)`; } far.drawImage(LTMP,-m,-m,LTMP.width+2*m,LTMP.height+2*m); far.filter='none';
  g=layerCtx(LMID); drawMid(); g=layerCtx(LFRONT); drawFront(); }

/* ===================== utilidades de desenho ===================== */
function rect(x,y,w,h,f){ g.fillStyle=f; g.fillRect(x,y,w,h); }
function poly(pts,f,stroke,lw){ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); if(f){ g.fillStyle=f; g.fill(); } if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw||1; g.stroke(); } }
function line(x0,y0,x1,y1,c,lw){ g.strokeStyle=c; g.lineWidth=lw||1; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); }
function lin(x0,y0,x1,y1,stops){ const gr=g.createLinearGradient(x0,y0,x1,y1); for(const [t,c] of stops) gr.addColorStop(t,c); return gr; }
function rad(x,y,r0,r1,stops,x2,y2){ const gr=g.createRadialGradient(x,y,r0,x2==null?x:x2,y2==null?y:y2,r1); for(const [t,c] of stops) gr.addColorStop(t,c); return gr; }
function glow(x,y,r,rgb,a){ g.save(); g.globalCompositeOperation='lighter'; g.fillStyle=rad(x,y,0,r,[[0,`rgba(${rgb},${a})`],[.4,`rgba(${rgb},${a*.4})`],[1,`rgba(${rgb},0)`]]); g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); g.restore(); }
function ellipse(x,y,rx,ry,f){ g.fillStyle=f; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
/* iluminação de fachada: luz quente vindo da direita, oclusão embaixo */
function lightWall(x,y,w,h,k){ k=k||1; g.fillStyle=lin(x,0,x+w,0,[[0,`rgba(20,16,40,${.22*k})`],[.55,'rgba(0,0,0,0)'],[1,`rgba(255,200,140,${.14*k})`]]); g.fillRect(x,y,w,h);
  g.fillStyle=lin(0,y,0,y+h,[[0,'rgba(0,0,0,0)'],[.7,'rgba(0,0,0,0)'],[1,`rgba(8,6,16,${.42*k})`]]); g.fillRect(x,y,w,h); line(x+w-.5,y,x+w-.5,y+h,'rgba(255,220,170,.35)',1); line(x+.5,y,x+.5,y+h,'rgba(0,0,0,.35)',1); }
function shadowOnGround(x,y,w,h,dark){ // sombra projetada para a esquerda-frente
  const L=Math.min(h*.32,120); g.fillStyle=lin(x,0,x-L,0,[[0,`rgba(10,8,20,${dark||.22})`],[1,'rgba(10,8,20,0)']]); poly([[x,y],[x+w*.35,y],[x+w*.35-L*.9,y+14],[x-L,y+14]],g.fillStyle); }

/* ===================== materiais ===================== */
function planks(x,y,w,h,c,seed,vertical){ const r=rng(seed||3); rect(x,y,w,h,col(c,1)); const bw=vertical?13:10;
  if(vertical){ for(let u=x;u<x+w;u+=bw){ const ww=Math.min(bw,x+w-u), t=.9+r()*.22; rect(u,y,ww,h,col(c,t)); rect(u,y,1,h,'rgba(10,6,4,.45)'); rect(u+ww-1,y,1,h,'rgba(255,230,190,.08)'); if(r()>.5){ const ky=y+r()*h; ellipse(u+ww*.5,ky,1.8,3,col(c,.6)); } } }
  else { for(let v=y;v<y+h;v+=bw){ const hh=Math.min(bw,y+h-v), t=.9+r()*.22; rect(x,v,w,hh,col(c,t)); rect(x,v,w,1,'rgba(10,6,4,.45)'); rect(x,v+hh-1,w,1,'rgba(255,230,190,.08)'); } }
  g.strokeStyle='rgba(20,10,6,.16)'; g.lineWidth=1; for(let i=0;i<w*h/380;i++){ const gx=x+r()*w, gy=y+r()*h; g.beginPath(); g.moveTo(gx,gy); g.lineTo(gx+(vertical?0:6+r()*10),gy+(vertical?6+r()*12:0)); g.stroke(); } }
function bricks(x,y,w,h,c,seed,bw,bh){ bw=bw||20; bh=bh||9; const r=rng(seed||5); rect(x,y,w,h,col(c,.72)); let row=0;
  for(let v=y;v<y+h;v+=bh,row++){ const off=row%2?bw/2:0; for(let u=x-bw+off;u<x+w;u+=bw){ const x0=Math.max(x,u), x1=Math.min(x+w,u+bw-1.2); if(x1<=x0) continue; const hh=Math.min(bh-1.2,y+h-v); rect(x0,v,x1-x0,hh,col(c,.86+r()*.3)); if(r()>.8) rect(x0,v,x1-x0,1,'rgba(255,240,220,.12)'); } } }
function stones(x,y,w,h,c,seed,bw,bh){ bw=bw||30; bh=bh||15; const r=rng(seed||7); rect(x,y,w,h,col(c,.62)); let row=0;
  for(let v=y;v<y+h;v+=bh,row++){ let u=x-(row%2?bw*.45:0)-r()*bw*.3; while(u<x+w){ const ww=bw*(.7+r()*.7); const x0=Math.max(x,u), x1=Math.min(x+w,u+ww-1.5); if(x1>x0){ const hh=Math.min(bh-1.5,y+h-v); const t=.88+r()*.28; g.fillStyle=col(c,t); g.beginPath(); g.roundRect(x0,v,x1-x0,hh,1.5); g.fill(); rect(x0,v,x1-x0,1,`rgba(255,240,220,${.06+r()*.08})`); rect(x0,v+hh-1,x1-x0,1,'rgba(0,0,0,.18)'); } u+=ww; } } }
function plaster(x,y,w,h,c,seed){ const r=rng(seed||9); rect(x,y,w,h,lin(0,y,0,y+h,[[0,col(c,1.04)],[1,col(c,.9)]])); for(let i=0;i<w*h/60;i++){ g.fillStyle=r()>.5?'rgba(255,255,255,.05)':'rgba(40,30,20,.06)'; g.fillRect(x+r()*w,y+r()*h,1.5,1.5); }
  for(let i=0;i<3;i++){ const sx=x+r()*w, sw=10+r()*30; g.fillStyle=lin(0,y+h-30,0,y+h,[[0,'rgba(60,50,40,0)'],[1,'rgba(60,50,40,.22)']]); g.fillRect(sx,y+h-30,sw,30); } }
function shingles(pts,c,rowH,seed){ const r=rng(seed||11); g.save(); g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.clip();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  rect(x0,y0,x1-x0,y1-y0,col(c,.7)); rowH=rowH||8; let row=0; const sw=rowH*1.5;
  for(let v=y0;v<y1;v+=rowH,row++){ const off=row%2?sw/2:0; for(let u=x0-sw+off;u<x1;u+=sw){ g.fillStyle=col(c,.85+r()*.32); g.beginPath(); g.roundRect(u,v,sw-1,rowH+2,[0,0,3,3]); g.fill(); } rect(x0,v,x1-x0,1,'rgba(0,0,0,.28)'); }
  g.fillStyle=lin(0,y0,0,y1,[[0,'rgba(255,220,180,.12)'],[1,'rgba(0,0,0,.25)']]); g.fillRect(x0,y0,x1-x0,y1-y0); g.restore(); poly(pts,null,'rgba(20,12,10,.55)',1); }
function tiles(pts,c,seed){ // telhas curvas (pagode/mesquita)
  const r=rng(seed||13); g.save(); g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.clip(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  rect(x0,y0,x1-x0,y1-y0,col(c,.75)); for(let u=x0;u<x1;u+=7){ rect(u,y0,3.5,y1-y0,col(c,1.05+r()*.15)); rect(u+3.5,y0,3.5,y1-y0,col(c,.7)); } for(let v=y0+6;v<y1;v+=6) rect(x0,v,x1-x0,1,'rgba(0,0,0,.18)');
  g.fillStyle=lin(0,y0,0,y1,[[0,'rgba(255,230,190,.14)'],[1,'rgba(0,0,0,.3)']]); g.fillRect(x0,y0,x1-x0,y1-y0); g.restore(); poly(pts,null,'rgba(10,8,8,.6)',1); }

/* ===================== componentes ===================== */
function clipPoly(pts,fn){ g.save(); g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.clip(); fn(); g.restore(); }
function archPath(x,y,w,h){ g.beginPath(); g.moveTo(x,y+h); g.lineTo(x,y+w/2); g.arc(x+w/2,y+w/2,w/2,Math.PI,0); g.lineTo(x+w,y+h); g.closePath(); }
function pointedPath(x,y,w,h){ g.beginPath(); g.moveTo(x,y+h); g.lineTo(x,y+w*.55); g.quadraticCurveTo(x,y,x+w/2,y); g.quadraticCurveTo(x+w,y,x+w,y+w*.55); g.lineTo(x+w,y+h); g.closePath(); }
function windowBox(x,y,w,h,o){ o=o||{}; const lit=o.lit==null?1:o.lit, fc=o.frame||'#3A2A22';
  if(o.arch==='pointed'){ g.fillStyle=fc; pointedPath(x-2,y-3,w+4,h+5); g.fill(); } else if(o.arch){ g.fillStyle=fc; archPath(x-2,y-2,w+4,h+4); g.fill(); } else rect(x-2,y-2,w+4,h+4,fc);
  g.save(); if(o.arch==='pointed') pointedPath(x,y,w,h); else if(o.arch) archPath(x,y,w,h); else { g.beginPath(); g.rect(x,y,w,h); } g.clip();
  const warm=o.rgb||'255,206,130';
  rect(x,y,w,h,lit>0?lin(0,y,0,y+h,[[0,`rgba(${warm},${.6+.4*lit})`],[1,`rgba(255,160,80,${.55+.45*lit})`]]):lin(0,y,0,y+h,[[0,'#1B2536'],[1,'#0B0F16']]));
  if(lit>0){ rect(x+1,y+1,w*.34,h*.4,'rgba(255,255,235,.32)'); if(o.curtain){ rect(x,y,w*.3,h,'rgba(120,40,50,.55)'); rect(x+w*.7,y,w*.3,h,'rgba(120,40,50,.55)'); } }
  else rect(x+1,y+1,w*.35,h*.42,'rgba(140,170,210,.16)');
  const cols=(o.mull&&o.mull[0])!=null?o.mull[0]:2, rows=(o.mull&&o.mull[1])!=null?o.mull[1]:2; g.fillStyle=fc; for(let i=1;i<cols;i++) g.fillRect(x+w*i/cols-.8,y,1.6,h); for(let i=1;i<rows;i++) g.fillRect(x,y+h*i/rows-.8,w,1.6);
  g.restore();

  g.fillStyle=hotness?'#8A6640':'#6E4E34'; g.beginPath(); g.roundRect(bx,by,bw,bh,3); g.fill(); g.fillStyle='rgba(255,255,255,.08)'; g.fillRect(bx+2,by+2,bw-4,2);
  g.strokeStyle=hotness?'#F1D27A':'rgba(30,20,12,.9)'; g.lineWidth=hotness?1.6:1; g.beginPath(); g.roundRect(bx,by,bw,bh,3); g.stroke(); if(hotness){ g.save(); g.shadowColor='rgba(241,210,122,.8)'; g.shadowBlur=12; g.stroke(); g.restore(); }
  g.fillStyle='#F2E8D2'; g.textAlign='center'; g.textBaseline='alphabetic'; g.font=`600 ${14*sc}px "Grenze Gotisch", Georgia, serif`; g.fillText(name,x,by+14*sc); g.font=`700 ${8.5*sc}px Karla, sans-serif`; g.fillStyle=subC; g.fillText(sub.toUpperCase(),x,by+26*sc); g.textAlign='left';
  return [bx,by,bw,bh+10]; }
function signs(){ signHits=[]; for(const p of PLACES){ const isHot=(hot===p.id||sel===p.id); if(!(showAll||isHot)) continue; const s=subFor(p); const r=drawSign(p.sign[0],p.sign[1],p.name,s[0],s[1],isHot); signHits.push({id:p.id,rect:r}); } }
function hitAt(vx,vy){ for(const h of signHits){ const [x,y,w,hh]=h.rect; if(vx>=x&&vx<=x+w&&vy>=y&&vy<=y+hh) return h.id; } let best=null,ba=1e12; for(const p of PLACES){ const [x,y,w,h]=p.rect; if(vx>=x&&vx<=x+w&&vy>=y&&vy<=y+h){ const a=w*h; if(a<ba){ ba=a; best=p.id; } } } return best; }
function renderCard(){ const id=hot||sel; const p=id?PLACES.find(q=>q.id===id):null; let k,cls,h,n,txt,pct,barCls='';
  if(p){ if(p.t==null){ k=p.genre; cls='open'; h=p.name; n='∞'; pct=100; txt=p.p; } else { const lab={open:'Aberto',near:'Quase lá',sealed:'Selado'}[p.st]; k=`${lab} · ${p.genre}`; cls=p.st; h=p.name; n=`${p.n}<small>de ${p.t}</small>`; pct=p.n/p.t*100; barCls=p.st==='open'?'':p.st; txt=p.p+` <a href="https://claude.ai/code/artifact/7d9aa841-9e1e-47cd-8c3f-025413ac85e5" target="_blank" rel="noopener">ver no mapa ↗</a>`; } }
  else { cardEl.innerHTML=''; return; }
  cardEl.innerHTML=`<div class="card"><div class="k ${cls}">${k}</div><h2>${h}</h2><div class="n">${n}</div><p>${txt}</p><div class="bar ${barCls}"><i style="width:${pct}%"></i></div></div>`; }
function updateStats(){ let o=0,nn=0,s=0; for(const p of PLACES){ if(p.t==null) continue; if(p.st==='open')o++; else if(p.st==='near')nn++; else s++; } document.getElementById('sOpen').textContent=o; document.getElementById('sNear').textContent=nn; document.getElementById('sSeal').textContent=s; }
function buildSr(){ srEl.innerHTML=''; for(const p of PLACES){ const b=document.createElement('button'); b.type='button'; b.textContent=`${p.name} — ${p.genre}`; b.addEventListener('focus',()=>{ hot=p.id; renderCard(); }); b.addEventListener('blur',()=>{ hot=null; renderCard(); }); b.addEventListener('click',()=>{ sel=sel===p.id?null:p.id; renderCard(); }); srEl.appendChild(b); } }

/* ===================== laço ===================== */
let last=0, lastT=0, ema=0, nfr=0, autoDone=false;
function setGFX(v){ GFX=v; for(const b of document.querySelectorAll('#gfx button')) b.setAttribute('aria-pressed',(+b.dataset.gfx===v)?'true':'false'); renderStatic(); if(reduce) frame(T); }
function frame(now){ T=now; const dt=Math.min(.1,now-lastT); lastT=now; stepWalkers(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#08070D'; ctx.fillRect(0,0,W,H); ctx.imageSmoothingEnabled=true;
  const dw=VW*S, dh=VH*S; ctx.drawImage(LFAR,OX,OY,dw,dh); ctx.drawImage(LMID,OX,OY,dw,dh);
  g=ctx; ctx.save(); ctx.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR); dynamicsBack(now); ctx.restore();
  ctx.drawImage(LFRONT,OX,OY,dw,dh);
  ctx.save(); ctx.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR); dynamicsFront(now); ctx.restore();
  postFX(now);
  ctx.save(); ctx.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR); signs(); ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0); vignette(); }
function loop(ts){ const now=ts/1000; if(cv.clientWidth!==W||cv.clientHeight!==H) fit(); if(now-last>1/30){ last=now; const t0=performance.now(); frame(now); const d=performance.now()-t0; ema=ema?ema*.93+d*.07:d; nfr++; if(!autoDone&&nfr>150&&ema>38&&GFX===2){ autoDone=true; setGFX(1); } } requestAnimationFrame(loop); }

/* ===================== interação ===================== */
let drag=null;
window.addEventListener('keydown',e=>{ if(e.key==='Shift') showAll=true; }); window.addEventListener('keyup',e=>{ if(e.key==='Shift') showAll=false; }); window.addEventListener('blur',()=>{ showAll=false; });
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); drag={x:e.clientX,p0:pan,moved:false,id:e.pointerId}; });
cv.addEventListener('pointermove',e=>{ const rc=cv.getBoundingClientRect(), mx=e.clientX-rc.left, my=e.clientY-rc.top;
  if(drag&&drag.id===e.pointerId){ const dx=e.clientX-drag.x; if(Math.abs(dx)>4&&panMax>0){ drag.moved=true; cv.classList.add('drag'); pan=clamp(drag.p0+dx,-panMax,panMax); OX=(W-VW*S)/2+pan; if(reduce) frame(T); } return; }
  const [vx,vy]=toV(mx,my); const id=hitAt(vx,vy); if(id!==hot){ hot=id; cv.classList.toggle('hot',!!id); renderCard(); if(reduce) frame(T); } });
cv.addEventListener('pointerup',e=>{ if(!drag) return; const moved=drag.moved; drag=null; cv.classList.remove('drag'); if(!moved){ const rc=cv.getBoundingClientRect(); const [vx,vy]=toV(e.clientX-rc.left,e.clientY-rc.top); const id=hitAt(vx,vy); sel=(id&&sel!==id)?id:null; renderCard(); if(reduce) frame(T); } });
cv.addEventListener('pointercancel',()=>{ drag=null; cv.classList.remove('drag'); });
cv.addEventListener('mouseleave',()=>{ if(!drag){ hot=null; cv.classList.remove('hot'); renderCard(); } });
cv.addEventListener('wheel',e=>{ if(panMax<=0) return; e.preventDefault(); pan=clamp(pan-(e.deltaX||e.deltaY)*.6,-panMax,panMax); OX=(W-VW*S)/2+pan; if(reduce) frame(T); },{passive:false});
for(const b of document.querySelectorAll('#gfx button')) b.addEventListener('click',()=>{ autoDone=true; setGFX(+b.dataset.gfx); });
window.addEventListener('resize',()=>{ fit(); if(reduce) frame(T); });
if('ResizeObserver' in window){ try{ new ResizeObserver(()=>{ if(cv.clientWidth!==W||cv.clientHeight!==H){ fit(); if(reduce) frame(T); } }).observe(document.getElementById('game')); }catch(e){} }
if(document.fonts&&document.fonts.load){ document.fonts.load('600 14px "Grenze Gotisch"'); document.fonts.load('700 10px Karla'); }
if(window.innerWidth<720||(navigator.hardwareConcurrency||8)<=2) GFX=1;
for(const b of document.querySelectorAll('#gfx button')) b.setAttribute('aria-pressed',(+b.dataset.gfx===GFX)?'true':'false');
buildSr(); updateStats(); renderCard(); fit();
if(reduce){ frame(0); } else { requestAnimationFrame(loop); }
})();
</script>
