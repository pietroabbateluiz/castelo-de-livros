<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="O mundo da Odisseia: 13 paragens do poema de Homero, 91 cenas que abrem conforme os cantos sao lidos.">
<title>Mundo de Luiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;500;600&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --void:#08070D; --panel:rgba(14,11,20,.78); --line:rgba(201,162,39,.32);
    --parch:#EFE6D2; --dust:#A2937F; --dust-2:#6E6357;
    --gold:#D4AC35; --gold-hi:#F1D27A; --moss:#8CA063; --verm:#C24B35;
    --fs-xs:.7rem;--fs-sm:.84rem;--fs-lg:1.35rem;--fs-xl:1.9rem;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--parch);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #game{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;background:var(--void);}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #c.hot{cursor:pointer;} #c.drag{cursor:grabbing;}

  #game.inroom .hud{opacity:0;pointer-events:none;}
  .hud{transition:opacity .22s ease;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  .hud{position:absolute;z-index:3;}
  .panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .hud-tl{left:18px;top:18px;padding:12px 16px 13px;min-width:236px;}
  .crest{display:flex;align-items:center;gap:11px;}
  .crest svg{width:30px;height:34px;flex:none;}
  .crest h1{font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:var(--fs-xl);line-height:1;margin:0;letter-spacing:.01em;}
  .crest .who{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px;}
  .stats{display:flex;gap:16px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);}
  .stat b{display:block;font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:1.35rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .stat span{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dust);}

  .regions{left:50%;top:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:64vw;padding:4px;gap:3px;}
  .regions button{appearance:none;border:0;background:transparent;color:var(--dust);cursor:pointer;padding:7px 13px 8px;border-radius:4px;text-align:left;line-height:1;font-family:"Grenze Gotisch",Georgia,serif;font-size:1.02rem;}
  .regions button small{display:block;font:700 .58rem/1 Karla,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;color:var(--dust-2);}
  .regions button:hover{color:var(--parch);}
  .regions button[aria-pressed="true"]{background:rgba(212,172,53,.14);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(212,172,53,.45);}
  .regions button[aria-pressed="true"] small{color:var(--gold);}
  .regions button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}

  .hud-tr{right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .seg{display:inline-flex;padding:3px;gap:2px;}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dust);font:700 .72rem/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:4px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:rgba(212,172,53,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(212,172,53,.45);}
  .seg a.linkbtn{display:inline-block;color:var(--gold-hi);font:700 .72rem/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:4px;text-decoration:none;}
  .seg a.linkbtn:hover{background:rgba(212,172,53,.16);}
  .seg button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}
  .zoom{display:inline-flex;padding:3px;gap:2px;}
  .zoom button{appearance:none;border:0;background:transparent;color:var(--parch);font:500 1rem/1 "Grenze Gotisch",Georgia,serif;width:30px;height:28px;border-radius:4px;cursor:pointer;}
  .zoom button:hover{background:rgba(212,172,53,.14);color:var(--gold-hi);}
  .hint{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--dust-2);padding:6px 10px;}
  #gfx button{padding:7px 10px;}

  .hud-b{left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100% - 36px));padding:12px 18px 13px;}
  .card{display:grid;grid-template-columns:1fr auto;gap:2px 18px;align-items:baseline;}
  .card .k{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .card .k.sealed{color:var(--verm);} .card .k.near{color:var(--moss);}
  .card h2{font-family:"Grenze Gotisch",Georgia,serif;font-weight:500;font-size:var(--fs-lg);line-height:1;margin:2px 0 0;}
  .card .n{grid-column:2;grid-row:1/3;font-family:"Grenze Gotisch",Georgia,serif;font-size:1.6rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .card .n small{font-family:Karla,sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dust);margin-left:6px;}
  .card p{grid-column:1/-1;margin:6px 0 0;font-size:var(--fs-sm);color:var(--dust);}
  .bar{grid-column:1/-1;height:5px;margin-top:9px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .bar.near i{background:linear-gradient(90deg,#6E8250,var(--moss));}

  .hud-br{right:18px;bottom:20px;padding:8px 12px;display:flex;gap:14px;font-size:var(--fs-xs);letter-spacing:.06em;color:var(--dust);}
  .hud-br span{display:inline-flex;align-items:center;gap:6px;}
  .hud-br i{width:8px;height:8px;transform:rotate(45deg);display:block;}

  @media (max-width:980px){ .regions{top:auto;bottom:118px;} .regions button{padding:6px 9px 7px;font-size:.92rem;} .regions button small{display:none;} .hint{display:none;} }
  @media (max-width:640px){ .hud-tl{min-width:0;padding:10px 12px;} .stats{gap:12px;} .hud-br{display:none;} .crest h1{font-size:1.45rem;} #gfx button{padding:6px 6px;font-size:.6rem;letter-spacing:.06em;} }
</style>

</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Mapa noturno de um mundo de leitura: bosque, vila, charneca, lago com farol e um observatório no alto de um promontório."></canvas>
  <div class="sr" id="sr" aria-label="Lugares do mundo"></div>

  <aside class="hud panel hud-tl">
    <div class="crest">
      <svg viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 L28 6 V17 C28 25 22 30 15 33 C8 30 2 25 2 17 V6 Z" fill="#1B1522" stroke="#D4AC35" stroke-width="1.4"/><path d="M9 11 h12 v3 h-12 z M10 15 h10 v9 h-10 z" fill="#D4AC35"/><path d="M13 17 h4 v7 h-4 z" fill="#1B1522"/></svg>
      <div>
        <h1>Mundo de Luiz</h1>
        <div class="who" id="who">Mês 3 · 84 livros</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sOpen">7</b><span>abertos</span></div>
      <div class="stat"><b id="sNear">13</b><span>gêneros</span></div>
      <div class="stat"><b id="sSeal">78</b><span>trancados</span></div>
    </div>
  </aside>

  <nav class="hud panel regions" aria-label="Regiões" id="regions"></nav>

  <div class="hud hud-tr">
    <div class="seg panel" role="group" aria-label="Momento">
      <button type="button" data-preset="inicio" aria-pressed="true">Início</button>
      <button type="button" data-preset="lendo" aria-pressed="false">Lendo</button>
      <button type="button" data-preset="estante" aria-pressed="false" title="Abre o que você já leu na sua estante">Minha estante</button>
    </div>
    <div class="seg panel"><a href="estante.html" class="linkbtn" title="Cadastrar e ver seus livros">📚 Estante</a></div>
    <div class="zoom panel" role="group" aria-label="Zoom">
      <button type="button" id="zin" aria-label="Aproximar">+</button>
      <button type="button" id="zout" aria-label="Afastar">−</button>
      <button type="button" id="zall" aria-label="Ver tudo" style="width:auto;padding:0 10px;font-size:.8rem;font-family:Karla,sans-serif;letter-spacing:.1em;">TUDO</button>
    </div>
    <div class="seg panel" role="group" aria-label="Qualidade gráfica" id="gfx" title="Qualidade gráfica">
      <button type="button" data-gfx="1" aria-pressed="true">Alto</button>
      <button type="button" data-gfx="0" aria-pressed="false">Clássico</button>
    </div>
    <div class="hint panel">arraste · role para aproximar · clique numa sala aberta para entrar · Shift = placas</div>
  </div>

  <div class="hud panel hud-b" id="card"></div>

  <div class="hud panel hud-br">
    <span><i style="background:#D4AC35"></i>Sala aberta</span>
    <span><i style="background:#C24B35"></i>Trancada · 1 livro 🔑</span>
  </div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const cardEl=document.getElementById('card'), srEl=document.getElementById('sr');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;

/* ===================== câmera / projeção ===================== */
let TW0=16,TH0=8,ZH0=13.6,OX0=0,OY0=0, Z=1,panX=0,panY=0, TW=16,TH=8,ZH=13.6, W=0,H=0,DPR=1,T=0;
let cam=null; // alvo de tween {Z,panX,panY}

/* ===================== v8 · luz e qualidade gráfica (estilo HD-2D) ===================== */
let GFX=1; // (Ultra removido) 2 = Ultra (sombras, texturas, pós-processamento) · 1 = Alto (sem pós) · 0 = Clássico (visual original)
const LIGHT={x:0.35,y:-0.94};      // de onde vem a luz da lua (alto-direita da tela)
const SHADOW_DIR={x:-0.18,y:0.98}; // para onde as sombras se estendem, por unidade de altura
const BBOX={xmin:-25,xmax:42,ymin:-16,ymax:36,zmin:-3,zmax:10.6};
let OFX=0,OFY=0,OFK=0;
function P(x,y,z){ x+=OFX; y+=OFY; return [(OX0+(x-y)*TW0)*Z+panX, (OY0+(x+y)*TH0-(z||0)*ZH0)*Z+panY]; }
function ROFF(r){ OFX=(r&&r.ox)||0; OFY=(r&&r.oy)||0; OFK=OFX+OFY; }
function OFF(dx,dy){ OFX=dx||0; OFY=dy||0; OFK=OFX+OFY; }
const ISLE_U=72, ISLE_V=38; /* semi-eixos da ilha em (u,v) */
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1); W=Math.max(1,cv.clientWidth); H=Math.max(1,cv.clientHeight);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=(ISLE_U+5)*Math.SQRT2, sy=(ISLE_V+5)*Math.SQRT2, zh=9*0.85; /* extensão da ilha em unidades de TW0 (largura) e de TH0 (altura) */
  const tw=Math.min((W*0.96)/(2*sx),(H*0.92)/(sy+zh));
  TW0=tw; TH0=tw/2; ZH0=tw*0.85;
  OX0=W/2; OY0=H*0.53;
  applyZoom();
}
function applyZoom(){ TW=TW0*Z; TH=TH0*Z; ZH=ZH0*Z; clampPan(); }
function clampPan(){
  const e=[UV(-ISLE_U-4,0),UV(ISLE_U+4,0),UV(0,-ISLE_V-4),UV(0,ISLE_V+4)]; const _x=OFX,_y=OFY; OFF(0,0);
  const xs=e.map(q=>P(q[0],q[1],0)[0]), ys=e.map(q=>P(q[0],q[1],0)[1]); OFF(_x,_y); ys[2]-=ZH*9;
  const L=Math.min(...xs),R=Math.max(...xs),Tp=Math.min(...ys),B=Math.max(...ys);
  if(R<W*0.35) panX+=W*0.35-R; if(L>W*0.65) panX-=L-W*0.65; if(B<H*0.35) panY+=H*0.35-B; if(Tp>H*0.65) panY-=Tp-H*0.65;
}
function zoomAt(mx,my,f){ const nz=clamp(Z*f,0.85,zoomCapAt(mx,my)), k=nz/Z; panX=mx-(mx-panX)*k; panY=my-(my-panY)*k; Z=nz; applyZoom(); cam=null; }
function focusWorld(x,y,z,zoom){ const s=[OX0+(x-y)*TW0, OY0+(x+y)*TH0-z*ZH0]; cam={Z:zoom, panX:W/2-s[0]*zoom, panY:H*0.47-s[1]*zoom}; }
function tickCam(){ if(!cam) return; const k=reduce?1:0.14; Z=lerp(Z,cam.Z,k); panX=lerp(panX,cam.panX,k); panY=lerp(panY,cam.panY,k); applyZoom(); if(Math.abs(Z-cam.Z)<0.002&&Math.abs(panX-cam.panX)<0.5&&Math.abs(panY-cam.panY)<0.5){ Z=cam.Z; panX=cam.panX; panY=cam.panY; applyZoom(); cam=null; } }

/* ===================== cor / util ===================== */
function col(c,f,a){ const r=Math.min(255,c[0]*f)|0,g=Math.min(255,c[1]*f)|0,b=Math.min(255,c[2]*f)|0; return a==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a})`; }
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rng(seed){ let s=seed|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function inPoly(pt,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i],b=poly[j]; if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
const M={ wood:[112,80,54], wood2:[140,102,66], bark:[78,56,44], stone:[108,102,126], iron:[52,50,58], wax:[228,217,190], brass:[178,142,60], cloth:[128,64,82], moss:[80,104,68], trunk:[58,44,36] };
const BOOKS=[[160,62,48],[64,96,150],[212,172,53],[100,120,76],[130,74,112],[190,176,150],[52,116,104],[150,84,42],[90,72,122],[180,80,54]];

/* ===================== primitivas ===================== */
let prims=[];
function quad(pts,fill,stroke){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); if(stroke!==false){ ctx.strokeStyle=stroke||(GFX>=1?'rgba(8,6,12,.24)':'rgba(8,6,12,.38)'); ctx.lineWidth=1; ctx.stroke(); } }
/* ---- v8: sombras projetadas e utilidades de luz ---- */
function groundLevel(z){ return Math.abs(z)<0.36||Math.abs(z-AZ)<0.36||Math.abs(z-MZ)<0.36; }
function cvxHull(pts){ pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const q of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=pts.length-1;i>=0;i--){ const q=pts[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up); }
function castShadow(fp,z,h,alpha){ if(GFX<1||h<0.3) return; alpha=alpha||.26; const L=Math.min(h,2.8)*0.8, dx=SHADOW_DIR.x*L, dy=SHADOW_DIR.y*L;
  const pts=[]; let cx=0,cy=0,pm=-1e9; for(const q of fp){ pts.push(q,[q[0]+dx,q[1]+dy]); cx+=q[0]; cy+=q[1]; const t=q[0]*SHADOW_DIR.x+q[1]*SHADOW_DIR.y; if(t>pm) pm=t; } cx/=fp.length; cy/=fp.length;
  const hp=cvxHull(pts); if(hp.length<3) return; const tc=cx*SHADOW_DIR.x+cy*SHADOW_DIR.y, ax=cx+SHADOW_DIR.x*(pm-tc), ay=cy+SHADOW_DIR.y*(pm-tc); const a=P(ax,ay,z), b=P(ax+dx,ay+dy,z);
  const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]); g.addColorStop(0,`rgba(6,5,16,${alpha})`); g.addColorStop(.5,`rgba(6,5,16,${alpha*.62})`); g.addColorStop(1,'rgba(6,5,16,0)');
  ctx.fillStyle=g; ctx.beginPath(); hp.forEach((q,i)=>{ const sp=P(q[0],q[1],z); if(i)ctx.lineTo(sp[0],sp[1]); else ctx.moveTo(sp[0],sp[1]); }); ctx.closePath(); ctx.fill(); }
function slopeGrad(a,b,c,f0,f1){ const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]); g.addColorStop(0,col(c,f0)); g.addColorStop(1,col(c,f1)); return g; }
function offscreen(pts,m){ m=m||40; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; } return x1<-m||y1<-m||x0>W+m||y0>H+m; }
function drawBox(x,y,z,w,d,h,c,opt){ opt=opt||{}; const ft=opt.ft||1.24, fr=opt.fr||1.0, fl=opt.fl||0.7;
  if(GFX<1){ quad([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)],col(c,fl)); quad([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)],col(c,fr)); quad([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],col(c,ft)); return; }
  const A=P(x,y+d,z+h),B=P(x+w,y+d,z+h),C=P(x+w,y+d,z),D=P(x,y+d,z),E=P(x+w,y,z+h),F=P(x+w,y,z),G=P(x,y,z+h);
  if(offscreen([A,B,C,D,E,F,G],TW*3)) return;
  const hd=(h*ZH>6)&&((w*TW>5)||(d*TW>5));
  if(hd&&!opt.ns&&h>=0.32&&w>=0.2&&d>=0.2&&groundLevel(z)) castShadow([[x,y],[x+w,y],[x+w,y+d],[x,y+d]],z,h,0.26);
  let fL=col(c,fl), fR=col(c,fr);
  if(hd){ const gl=ctx.createLinearGradient(0,A[1],0,D[1]); gl.addColorStop(0,col(c,fl*1.08)); gl.addColorStop(.72,col(c,fl*0.94)); gl.addColorStop(1,col(c,fl*0.6)); fL=gl;
    const gr=ctx.createLinearGradient(0,E[1],0,F[1]); gr.addColorStop(0,col(c,fr*1.08)); gr.addColorStop(.72,col(c,fr*0.94)); gr.addColorStop(1,col(c,fr*0.64)); fR=gr; }
  quad([A,B,C,D],fL,col(c,fl*0.5,.55)); quad([E,B,C,F],fR,col(c,fr*0.5,.55)); quad([G,E,B,A],col(c,ft),col(c,ft*0.62,.55));
  if(hd){ // aresta iluminada pela lua + silhueta direita
    ctx.lineWidth=1; ctx.strokeStyle=col(c,ft*1.7,.5); ctx.beginPath(); ctx.moveTo(G[0],G[1]); ctx.lineTo(E[0],E[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
    ctx.strokeStyle=col(c,fr*1.5,.3); ctx.beginPath(); ctx.moveTo(E[0],E[1]); ctx.lineTo(F[0],F[1]); ctx.stroke();
    if(Z>1.45&&h>0.8&&(w>0.5||d>0.5)){ // fiadas de pedra / tábuas, só bem de perto
      ctx.strokeStyle='rgba(0,0,0,.11)'; ctx.beginPath(); for(let zz=z+0.34; zz<z+h-0.1; zz+=0.34){ const a=P(x,y+d,zz),b=P(x+w,y+d,zz),e=P(x+w,y,zz); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(e[0],e[1]); } ctx.stroke(); } }
}
function box(x,y,z,w,d,h,c,opt,k){ push((k!=null)?k:((x+w)+(y+d)+z*0.01),()=>drawBox(x,y,z,w,d,h,c,opt)); }
function push(k,f){ const ax=OFX,ay=OFY,ak=OFK;
  prims.push({k:k+ak, f:()=>{ const bx=OFX,by=OFY,bk=OFK; OFX=ax;OFY=ay;OFK=ak; try{ f(); } finally { OFX=bx;OFY=by;OFK=bk; } }}); }
