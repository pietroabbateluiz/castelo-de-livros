<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A Odisseia como arquipélago: um mapa de leitura gamificado, ilha por ilha.">
</head>
<body>
<title>Mundo de Luiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --void:#0F1420; --panel:rgba(20,22,34,.80); --line:rgba(214,178,94,.36);
    --parch:#F2E9D6; --dust:#B2A48C; --dust-2:#7E7466;
    --gold:#D6B25E; --gold-hi:#F4DFA6; --sea:#3E9AA8; --verm:#B94A38;
    --fs-xs:.7rem;--fs-sm:.84rem;--fs-lg:1.35rem;--fs-xl:1.9rem;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--parch);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #game{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;background:var(--void);}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #c.hot{cursor:pointer;} #c.drag{cursor:grabbing;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .hud{position:absolute;z-index:3;transition:opacity .22s ease;}
  .panel{background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .hud-tl{left:18px;top:18px;padding:12px 16px 13px;min-width:250px;}
  .crest{display:flex;align-items:center;gap:11px;}
  .crest svg{width:32px;height:34px;flex:none;}
  .crest h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:var(--fs-xl);line-height:1;margin:0;letter-spacing:.01em;}
  .crest .who{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:4px;}
  .stats{display:flex;gap:16px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);}
  .stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.4rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .stat span{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dust);}
  .regions{left:50%;top:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:min(800px,56vw);padding:3px;gap:1px;}
  .regions button{appearance:none;border:0;background:transparent;color:var(--dust);cursor:pointer;padding:4px 8px 5px;border-radius:4px;text-align:left;line-height:1;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:.95rem;}
  .regions button small{display:block;font:700 .5rem/1 Karla,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;color:var(--dust-2);}
  .regions button:hover{color:var(--parch);}
  .regions button[aria-pressed="true"]{background:rgba(214,178,94,.14);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(214,178,94,.45);}
  .regions button[aria-pressed="true"] small{color:var(--gold);}
  .regions button.soon{opacity:.55;}
  .regions button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}
  .hud-tr{right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;} .hud-tr>*{pointer-events:auto;}
  .seg{display:inline-flex;padding:3px;gap:2px;}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dust);font:700 .7rem/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;border-radius:4px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:rgba(214,178,94,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(214,178,94,.45);}
  .seg button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px;}
  .zoom{display:inline-flex;padding:3px;gap:2px;}
  .zoom button{appearance:none;border:0;background:transparent;color:var(--parch);font:500 1rem/1 "Cormorant Garamond",Georgia,serif;width:30px;height:28px;border-radius:4px;cursor:pointer;}
  .zoom button:hover{background:rgba(214,178,94,.14);color:var(--gold-hi);}
  .hint{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--dust-2);padding:6px 10px;}
  .hud-b{left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100% - 36px));padding:11px 16px 12px;} .hud-b:empty{display:none;}
  .card{display:grid;grid-template-columns:1fr auto;gap:2px 18px;align-items:baseline;}
  .card .k{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .card .k.sealed{color:var(--verm);} .card .k.soon{color:var(--dust);}
  .card h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:var(--fs-lg);line-height:1;margin:2px 0 0;}
  .card .n{grid-column:2;grid-row:1/3;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.6rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
  .card .n small{font-family:Karla,sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dust);margin-left:6px;}
  .card p{grid-column:1/-1;margin:5px 0 0;font-size:.8rem;color:var(--dust);}
  .card p em{color:var(--gold-hi);font-style:italic;}
  .card .q{grid-column:1/-1;margin:8px 0 0;padding-left:10px;border-left:2px solid rgba(214,178,94,.42);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:.98rem;color:#D9CCAE;}
  .bar{grid-column:1/-1;height:5px;margin-top:9px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .bar.sealed i{background:linear-gradient(90deg,#7E2A20,var(--verm));}
  .hud-br{display:flex;gap:12px;font-size:.64rem;letter-spacing:.06em;color:var(--dust);margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);}
  .hud-br span{display:inline-flex;align-items:center;gap:6px;}
  .hud-br i{width:7px;height:7px;transform:rotate(45deg);display:block;}
  @media (max-width:980px){ .regions{top:auto;bottom:14px;left:12px;right:12px;transform:none;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;} .regions::-webkit-scrollbar{display:none;} .regions button{padding:7px 9px 8px;font-size:.92rem;flex:none;} .regions button small{display:none;} .hint{display:none;} .hud-b{bottom:64px;} }
  @media (max-width:640px){ .hud-tl{min-width:0;padding:8px 10px;left:12px;top:12px;max-width:calc(100% - 190px);} .stats{gap:10px;margin-top:7px;padding-top:6px;} .stat b{font-size:1.1rem;} .stat span{font-size:.58rem;letter-spacing:.06em;} .hud-br{display:none;} .hud-b{width:calc(100% - 24px);} .crest h1{font-size:1.25rem;} .crest .who{font-size:.58rem;letter-spacing:.1em;} .crest svg{width:24px;height:26px;} .hud-tr{right:12px;top:12px;gap:6px;} .seg button{padding:6px 7px;font-size:.6rem;letter-spacing:.06em;} .zoom button{width:26px;height:26px;} #gfx button{padding:6px 6px;font-size:.58rem;letter-spacing:.04em;} }
</style>

<div id="game">
  <canvas id="c" aria-label="Arquipélago da Odisseia ao amanhecer: Ítaca com o palácio de Odisseu, e as ilhas da viagem espalhadas pelo mar."></canvas>
  <div class="sr" id="sr" aria-label="Cenas do poema"></div>

  <aside class="hud panel hud-tl">
    <div class="crest">
      <svg viewBox="0 0 32 34" aria-hidden="true"><path d="M3 22 Q16 30 29 22 L27 26 Q16 33 5 26 Z" fill="#1C1A24" stroke="#D6B25E" stroke-width="1.3"/><path d="M15 4 V22" stroke="#D6B25E" stroke-width="1.6"/><path d="M15 6 L25 9 L15 17 Z" fill="#D6B25E"/><path d="M8 20 L24 20" stroke="#D6B25E" stroke-width="1.2"/></svg>
      <div>
        <h1>Mundo de Luiz</h1>
        <div class="who" id="who">Início · reinos trancados</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sOpen">0</b><span>subgêneros lidos</span></div>
      <div class="stat"><b id="sSeal">0</b><span>por ler</span></div>
      <div class="stat"><b id="sIsl">0</b><span>de 15 gêneros</span></div>
    </div>
    <div class="hud-br">
      <span><i style="background:#D6B25E"></i>Subgênero lido</span>
      <span><i style="background:#B94A38"></i>Subgênero por ler</span>
      <span><i style="background:#7E7466"></i>Reino trancado</span>
    </div>
  </aside>

  <nav class="hud panel regions" aria-label="Ilhas e terras" id="regions"></nav>

  <div class="hud hud-tr">
    <div class="seg panel" role="group" aria-label="Modo">
      <button type="button" data-preset="inicio" aria-pressed="true">Início</button>
      <button type="button" data-preset="lendo" aria-pressed="false">Lendo</button>
      <button type="button" data-preset="estante" aria-pressed="false">Minha estante</button>
    </div>
    <a class="seg panel" href="estante.html" style="text-decoration:none;color:var(--gold-hi);font:700 .7rem/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;">📚 Estante</a>
    <div class="zoom panel" role="group" aria-label="Zoom">
      <button type="button" id="zin" aria-label="Aproximar">+</button>
      <button type="button" id="zout" aria-label="Afastar">−</button>
      <button type="button" id="zall" aria-label="Ver o arquipélago" style="width:auto;padding:0 10px;font:700 .7rem Karla,sans-serif;letter-spacing:.1em;">TUDO</button>
    </div>
    <div class="seg panel" role="group" aria-label="Qualidade gráfica" id="gfx">
      <button type="button" data-gfx="2" aria-pressed="true">Ultra</button>
      <button type="button" data-gfx="1" aria-pressed="false">Alto</button>
      <button type="button" data-gfx="0" aria-pressed="false">Simples</button>
    </div>
    <div class="hint panel">arraste e role para aproximar · clique num reino aberto · Shift = placas</div>
  </div>

  <div class="hud panel hud-b" id="card"></div>

</div>

<script>
(function(){
"use strict";
var WEBMASTER=false;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const cardEl=document.getElementById('card'), srEl=document.getElementById('sr');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){ let s=seed|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function inPoly(pt,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i],b=poly[j]; if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV'];

/* ===================== câmera / projeção isométrica ===================== */
let TW0=8,TH0=4,ZH0=6.8,OX0=0,OY0=0, Z=1,panX=0,panY=0, TW=8,TH=4,ZH=6.8, W=0,H=0,DPR=1,T=0; let cam=null;
/* extensão do mundo em coordenadas de tela: u = x-y (horizontal), v = x+y (vertical). Recalculada após gerar as ilhas. */
const EXT={umin:-60,umax:60,vmin:-72,vmax:50,zmax:8};
function P(x,y,z){ return [(OX0+(x-y)*TW0)*Z+panX, (OY0+(x+y)*TH0-(z||0)*ZH0)*Z+panY]; }
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1); W=Math.max(1,cv.clientWidth); H=Math.max(1,cv.clientHeight);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  const e=EXT, uw=(e.umax-e.umin), vh=(e.vmax-e.vmin)/2, zh=e.zmax*0.85;
  const PT=W<640?150:(W<980?110:108), PB=W<980?90:40; const tw=Math.min((W*0.96)/uw,((H-PT-PB)*0.98)/(vh+zh));
  TW0=tw; TH0=tw/2; ZH0=tw*0.85;
  OX0=W/2-(e.umin+e.umax)/2*TW0;
  const top=e.vmin*TH0-e.zmax*ZH0, bot=e.vmax*TH0; OY0=(PT+(H-PB))/2-(top+bot)/2;
  applyZoom(); }
function applyZoom(){ TW=TW0*Z; TH=TH0*Z; ZH=ZH0*Z; clampPan(); }
function clampPan(){ const e=EXT, ox=OX0*Z+panX, oy=OY0*Z+panY;
  const L=ox+e.umin*TW, R=ox+e.umax*TW, Tp=oy+e.vmin*TH-e.zmax*ZH, B=oy+e.vmax*TH;
  if(R<W*0.3) panX+=W*0.3-R; if(L>W*0.7) panX-=L-W*0.7; if(B<H*0.3) panY+=H*0.3-B; if(Tp>H*0.7) panY-=Tp-H*0.7; }
function zoomAt(mx,my,f){ const nz=clamp(Z*f,0.9,5.2), k=nz/Z; panX=mx-(mx-panX)*k; panY=my-(my-panY)*k; Z=nz; applyZoom(); cam=null; }
function focusWorld(x,y,z,zoom){ const s=[OX0+(x-y)*TW0, OY0+(x+y)*TH0-z*ZH0]; cam={Z:zoom, panX:W/2-s[0]*zoom, panY:H*0.5-s[1]*zoom}; }
function tickCam(){ if(!cam) return; const k=reduce?1:0.14; Z=lerp(Z,cam.Z,k); panX=lerp(panX,cam.panX,k); panY=lerp(panY,cam.panY,k); applyZoom();
  if(Math.abs(Z-cam.Z)<0.002&&Math.abs(panX-cam.panX)<0.5&&Math.abs(panY-cam.panY)<0.5){ Z=cam.Z; panX=cam.panX; panY=cam.panY; applyZoom(); cam=null; } }

/* ===================== luz da aurora ===================== */
let GFX=2;
const LIGHT={x:0.62,y:-0.78};            // o sol nasce à direita da tela, baixo
const SHADOW_DIR={x:-0.62,y:0.78};       // sombras longas para a esquerda
const WARM=[1.07,1.0,0.88], COOL=[0.86,0.92,1.10];
/* VEIL: cenas ainda não lidas são desenhadas desbotadas (azuladas), como sob névoa de manhã */
let VEIL=0; const CUR={veil:0};
function veil(r,g,b){ if(VEIL<=0) return [r,g,b]; const k=VEIL*0.58; const l=(r*0.3+g*0.5+b*0.2); return [r+(l*0.55+62-r)*k, g+(l*0.55+68-g)*k, b+(l*0.55+80-b)*k]; }
function col(c,f,a){ let r=Math.min(255,c[0]*f),g=Math.min(255,c[1]*f),b=Math.min(255,c[2]*f); if(VEIL>0){ [r,g,b]=veil(r,g,b); } r|=0; g|=0; b|=0; return a==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a})`; }
function colT(c,f,t,a){ // f = fator, t = 1 quente … -1 frio
  const w=t>0?WARM:COOL, k=Math.abs(t); const m=[1+(w[0]-1)*k,1+(w[1]-1)*k,1+(w[2]-1)*k];
  let r=Math.min(255,c[0]*f*m[0]),g=Math.min(255,c[1]*f*m[1]),b=Math.min(255,c[2]*f*m[2]); if(VEIL>0){ [r,g,b]=veil(r,g,b); } r|=0; g|=0; b|=0; return a==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a})`; }
/* níveis do terreno: mar 0 · terra baixa LOW · terraços LOW+1, LOW+2 … (objetos só projetam sombra quando apoiados num desses níveis) */
const LOW=0.4, LVH=0.5;   // LVH = altura de cada degrau de terraço
function groundLevel(z){ if(Math.abs(z)<0.2) return true; const m=(((z-LOW)%LVH)+LVH)%LVH; return m<0.12||m>LVH-0.12; }

/* ===================== primitivas ===================== */
let prims=[];
function push(k,f){ prims.push({k,f,v:CUR.veil}); }
function quad(pts,fill,stroke){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); if(stroke!==false){ ctx.strokeStyle=stroke||'rgba(30,22,18,.22)'; ctx.lineWidth=1; ctx.stroke(); } }
function offscreen(pts,m){ m=m||40; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; } return x1<-m||y1<-m||x0>W+m||y0>H+m; }
function cvxHull(pts){ pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const q of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=pts.length-1;i>=0;i--){ const q=pts[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up); }
function castShadow(fp,z,h,alpha){ if(GFX<1||h<0.25) return; alpha=alpha||.22; const L=Math.min(h,3.2)*1.25, dx=SHADOW_DIR.x*L, dy=SHADOW_DIR.y*L;
  const pts=[]; let cx=0,cy=0,pm=-1e9; for(const q of fp){ pts.push(q,[q[0]+dx,q[1]+dy]); cx+=q[0]; cy+=q[1]; const t=q[0]*SHADOW_DIR.x+q[1]*SHADOW_DIR.y; if(t>pm) pm=t; } cx/=fp.length; cy/=fp.length;
  const hp=cvxHull(pts); if(hp.length<3) return; const tc=cx*SHADOW_DIR.x+cy*SHADOW_DIR.y, ax=cx+SHADOW_DIR.x*(pm-tc), ay=cy+SHADOW_DIR.y*(pm-tc); const a=P(ax,ay,z), b=P(ax+dx,ay+dy,z);
  const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]); g.addColorStop(0,`rgba(20,26,60,${alpha})`); g.addColorStop(.5,`rgba(20,26,60,${alpha*.62})`); g.addColorStop(1,'rgba(20,26,60,0)');
  ctx.fillStyle=g; ctx.beginPath(); hp.forEach((q,i)=>{ const sp=P(q[0],q[1],z); if(i)ctx.lineTo(sp[0],sp[1]); else ctx.moveTo(sp[0],sp[1]); }); ctx.closePath(); ctx.fill(); }
function drawBox(x,y,z,w,d,h,c,opt){ opt=opt||{}; const ft=opt.ft||1.22, fr=opt.fr||1.08, fl=opt.fl||0.66;
  const A=P(x,y+d,z+h),B=P(x+w,y+d,z+h),C=P(x+w,y+d,z),D=P(x,y+d,z),E=P(x+w,y,z+h),F=P(x+w,y,z),G=P(x,y,z+h);
  if(offscreen([A,B,C,D,E,F,G],TW*3)) return;
  const hd=GFX>=1&&(h*ZH>11)&&((w*TW>9)||(d*TW>9));
  if(hd&&!opt.ns&&h>=0.32&&w>=0.2&&d>=0.2&&groundLevel(z)) castShadow([[x,y],[x+w,y],[x+w,y+d],[x,y+d]],z,h,0.22);
  let fL=colT(c,fl,-0.8), fR=colT(c,fr,0.9);
  if(hd){ const gl=ctx.createLinearGradient(0,A[1],0,D[1]); gl.addColorStop(0,colT(c,fl*1.08,-0.8)); gl.addColorStop(.7,colT(c,fl*0.95,-0.8)); gl.addColorStop(1,colT(c,fl*0.62,-0.9)); fL=gl;
    const gr=ctx.createLinearGradient(0,E[1],0,F[1]); gr.addColorStop(0,colT(c,fr*1.06,0.9)); gr.addColorStop(.7,colT(c,fr*0.95,0.7)); gr.addColorStop(1,colT(c,fr*0.68,0.2)); fR=gr; }

function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) lastPinch=0; if(ptrs.size===0){ dragging=false; cv.classList.remove('drag'); if(!moved&&downAt){ const r=cv.getBoundingClientRect(); const h=pick(e.clientX-r.left,e.clientY-r.top); if(h&&h.type==='scene') focusScene(h.s,h.isl); else if(h&&h.type==='isl'){ if(Z<1.4) focusIsland(h.isl); else { active=null; renderCard(); } } else { active=null; renderCard(); } } downAt=null; } }

cv.addEventListener('pointerleave',()=>{ if(!ptrs.size&&hover){ hover=null; cv.classList.remove('hot'); renderCard(); } });
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); const f=Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0016)); zoomAt(e.clientX-r.left,e.clientY-r.top,f); },{passive:false});
document.getElementById('zin').addEventListener('click',()=>zoomAt(W/2,H/2,1.35)); document.getElementById('zout').addEventListener('click',()=>zoomAt(W/2,H/2,1/1.35));
document.getElementById('zall').addEventListener('click',()=>{ cam={Z:0.9,panX:0,panY:0}; setNavPressed(null); active=null; renderCard(); });
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.preset)));
document.querySelectorAll('#gfx button').forEach(b=>b.addEventListener('click',()=>{ GFX=+b.dataset.gfx; PATS.grass=PATS.rock=PATS.sand=null; updateHUD(); }));
function setCanto(c){ CANTO=clamp(c,1,24); buildWorld(); refreshNav(); buildSR(); updateHUD(); }
function setPreset(p){ PRESET=p; buildWorld(); refreshNav(); buildSR(); updateHUD(); }
window.addEventListener('keydown',e=>{ if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const k=e.key;
  if(k==='+'||k==='='){ zoomAt(W/2,H/2,1.3); } else if(k==='-'||k==='_'){ zoomAt(W/2,H/2,1/1.3); } else if(k==='ArrowLeft'){ panX+=60; clampPan(); cam=null; } else if(k==='ArrowRight'){ panX-=60; clampPan(); cam=null; } else if(k==='ArrowUp'){ panY+=60; clampPan(); cam=null; } else if(k==='ArrowDown'){ panY-=60; clampPan(); cam=null; }
  else if(k===']'){ setCanto(CANTO+1); } else if(k==='['){ setCanto(CANTO-1); } else if(k==='Escape'){ cam={Z:0.9,panX:0,panY:0}; active=null; setNavPressed(null); renderCard(); } else if(k==='Shift'){ showSigns=true; } else if(k==='Tab'){ return; } else return; e.preventDefault(); });
window.addEventListener('keyup',e=>{ if(e.key==='Shift') showSigns=false; });

/* ===================== laço ===================== */
let last=performance.now(), slow=0, frames=0;
const DEBUG=/debug/.test(location.hash); const TM={};
function render(){ let t0=performance.now(); ctx.clearRect(0,0,W,H); drawSea(); if(DEBUG){ TM.sea=performance.now()-t0; t0=performance.now(); }
  const order=ISLANDS.filter(i=>i.loops.length).sort((a,b)=>(a.cx+a.cy)-(b.cx+b.cy)); for(const isl of order) drawIslandBase(isl); if(DEBUG){ TM.base=performance.now()-t0; t0=performance.now(); }
  for(const p of STATIC){ VEIL=p.v||0; p.f(); } VEIL=0; if(DEBUG){ TM.prims=performance.now()-t0; t0=performance.now(); TM.n=STATIC.length; }
  drawOverlay(); if(DEBUG){ TM.over=performance.now()-t0; t0=performance.now(); } postFX(); if(DEBUG){ TM.post=performance.now()-t0; window.__odT=TM; window.__od={ISLANDS,P,get Z(){return Z;},setGFX:g=>{GFX=g;},get GFX(){return GFX;},whoAt:(sx,sy)=>{ const res=[]; ctx.clearRect(0,0,W,H); drawSea(); for(const isl of ISLANDS.filter(i=>i.loops.length).sort((a,b)=>(a.cx+a.cy)-(b.cx+b.cy))) drawIslandBase(isl); const rd=()=>ctx.getImageData(Math.round(sx*DPR),Math.round(sy*DPR),1,1).data.join(); let prev=rd(); for(let i=0;i<STATIC.length;i++){ const p=STATIC[i]; VEIL=p.v||0; p.f(); const now=rd(); if(now!==prev){ res.push({i,k:+p.k.toFixed(3),a:p.a||p.f.toString().slice(0,70)}); prev=now; } } VEIL=0; return res; }}; } }
function loop(now){ const dt=now-last; last=now; if(!reduce) T+=Math.min(0.05,dt/1000); tickCam(); render();
  frames++; if(dt>36) slow++; if(frames>=60){ if(slow>=30&&GFX>0&&!DEBUG){ GFX--; PATS.grass=PATS.rock=PATS.sand=null; updateHUD(); } slow=0; frames=0; }
  requestAnimationFrame(loop); }
/* ===================== início ===================== */
for(const isl of ISLANDS) genIsland(isl);
refreshEstante(); if(ESTANTE.livros.length) PRESET='estante';
fit(); buildNav(); buildWorld(); buildSR(); updateHUD();
window.addEventListener('storage',e=>{ if(e.key===ESTANTE_KEY){ refreshEstante(); buildWorld(); refreshNav(); updateHUD(); } });
window.addEventListener('focus',()=>{ refreshEstante(); buildWorld(); refreshNav(); updateHUD(); });
window.__w={ISLANDS,P,focusWorld,islandAt:(x,y)=>{ for(const isl of ISLANDS){ for(const lp of isl.loops){ if(inPoly([x,y],lp.pts)) return isl; } } return null; },get Z(){return Z;},setPreset:(p)=>setPreset(p),get ema(){return 0;}};
window.addEventListener('resize',()=>{ fit(); });
requestAnimationFrame(t=>{ last=t; loop(t); });
})();
